# MediSync 베타 배포 — 4개 서비스 (db / api / frontend / caddy)
# Celery worker/beat/redis 는 베타엔 미가동. 자동 크롤링 없음.
# 운영 환경변수는 .env.production 에 작성 (git 미커밋, scp 업로드).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Seoul
    volumes:
      - pg_data:/var/lib/postgresql/data
    # 외부 노출 X — 같은 compose 네트워크에서만 접근
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      TZ: Asia/Seoul
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # 외부 직접 노출 X — Caddy 경유

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 같은 도메인에서 서빙하므로 보통 빈 값(상대경로) 또는 https://<도메인>
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - api
      - frontend

volumes:
  pg_data:
  caddy_data:
  caddy_config:
