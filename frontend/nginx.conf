server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # PWA shell — 항상 fresh 검증해야 새 빌드의 JS hash 가 보임.
  # PWA standalone 이 stale index.html 을 잡고 옛 번들만 fetch 하는 상황 방지.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }
  location = /manifest.json {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # hash 가 박힌 정적 자원만 immutable 캐시
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # SPA — 라우트 fallback
  location / {
    try_files $uri /index.html;
  }
}
