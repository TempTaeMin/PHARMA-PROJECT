server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 정적 자원 캐시
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  # SPA — 라우트 fallback
  location / {
    try_files $uri /index.html;
  }
}
